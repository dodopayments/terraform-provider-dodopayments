name: Acceptance tests
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: acceptance
  cancel-in-progress: false
env:
  DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_PAYMENTS_API_KEY }}
  DODO_PAYMENTS_IDENTITY_PROVIDER_ID: ${{ vars.DODO_PAYMENTS_IDENTITY_PROVIDER_ID }}
  DODO_PAYMENTS_ENVIRONMENT: test_mode
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform: ['1.12.*', 'latest']
    env:
      TF_ACC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go test ./internal/services/... -count=1 -v -timeout 45m -p 1 -parallel 4

  complete-example:
    needs: acceptance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.*'
          terraform_wrapper: false
      - name: Build the provider and use it in place of the registry version
        run: |
          go build -o "$RUNNER_TEMP/bin/terraform-provider-dodopayments" .
          cat > "$RUNNER_TEMP/terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "dodopayments/dodopayments" = "$RUNNER_TEMP/bin"
            }
            direct {}
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraformrc" >> "$GITHUB_ENV"
      - name: Apply
        working-directory: examples/complete
        run: terraform apply -auto-approve -input=false
      - name: Plan again. The plan must be empty.
        working-directory: examples/complete
        run: terraform plan -detailed-exitcode -input=false
      - name: Destroy
        if: always()
        working-directory: examples/complete
        run: terraform destroy -auto-approve -input=false

  sweep:
    needs: [acceptance, complete-example]
    if: always()
    runs-on: ubuntu-latest
    env:
      DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_PAYMENTS_API_KEY }}
      DODO_PAYMENTS_IDENTITY_PROVIDER_ID: ${{ vars.DODO_PAYMENTS_IDENTITY_PROVIDER_ID }}
      DODO_PAYMENTS_ENVIRONMENT: test_mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Sweep objects that the tests left behind
        run: go test ./internal/sweep -count=1 -v -sweep=test_mode
